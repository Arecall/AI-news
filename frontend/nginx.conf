server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        # SEO: 如果是爬虫访问文章页，转发到后端 SSR
        if ($http_user_agent ~* "googlebot|bingbot|baiduspider|yandexbot|slurp|duckduckbot") {
            rewrite ^/news/(\d+)$ /ssr/news/$1 break;
            proxy_pass http://backend:3003;
        }

        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /images/ {
        proxy_pass http://backend:3003/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
