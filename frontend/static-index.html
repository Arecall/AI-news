<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 新闻快讯</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #66758c;
      --line: #dce4ef;
      --accent: #d95f3d;
      --accent-soft: #fff0ea;
      --shadow: 0 16px 48px rgba(38, 55, 77, 0.08);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    a { color: inherit; }
    button, input { font: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(244, 247, 251, 0.86);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .nav {
      width: min(1180px, calc(100% - 32px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand { display: grid; gap: 2px; text-decoration: none; }
    .brand strong { font-size: 20px; }
    .brand span { color: var(--muted); font-size: 13px; }

    .search {
      width: min(360px, 48vw);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      outline: none;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 26px auto 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 22px;
    }

    .toolbar, .card, .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
    }

    .meta { color: var(--muted); font-size: 14px; }
    .refresh {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px 12px;
      cursor: pointer;
    }

    .list { display: grid; gap: 14px; }
    .card {
      display: grid;
      grid-template-columns: 188px minmax(0, 1fr);
      gap: 18px;
      padding: 14px;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 6px;
      background: #e9eef5;
    }

    .content { min-width: 0; display: grid; gap: 9px; align-content: start; }
    .chip {
      width: fit-content;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    h2 { margin: 0; font-size: 20px; line-height: 1.35; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    .row-foot { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; }
    .row-foot a { color: var(--accent); text-decoration: none; font-weight: 700; }

    .side { padding: 16px; align-self: start; display: grid; gap: 12px; }
    .side h3 { margin: 0 0 4px; font-size: 16px; }
    .rank { display: grid; grid-template-columns: 28px 1fr; gap: 10px; text-decoration: none; }
    .rank span:first-child { color: var(--accent); font-weight: 800; }
    .rank span:last-child { font-size: 14px; line-height: 1.45; }

    .state {
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 36px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .nav { align-items: flex-start; flex-direction: column; padding: 14px 0; }
      .search { width: 100%; }
      main { grid-template-columns: 1fr; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .card { grid-template-columns: 1fr; }
      .side { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="/">
        <strong>AI 新闻快讯</strong>
        <span>全球 AI 资讯实时索引</span>
      </a>
      <input id="search" class="search" type="search" placeholder="搜索标题、摘要或正文" />
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div>
        <strong>最新资讯</strong>
        <div id="meta" class="meta">正在加载...</div>
      </div>
      <button id="refresh" class="refresh" type="button">刷新</button>
    </section>

    <section id="list" class="list"></section>
    <aside id="side" class="side"></aside>
  </main>

  <script>
    const PAGE_SIZE = 50;
    const fallbackImage = '/images/ogimage.png';
    const state = { all: [], filtered: [], query: '' };

    const list = document.querySelector('#list');
    const side = document.querySelector('#side');
    const meta = document.querySelector('#meta');
    const search = document.querySelector('#search');
    const refresh = document.querySelector('#refresh');

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function formatDate(value) {
      if (!value) return '刚刚';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '刚刚';
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function summary(item) {
      const text = String(item.summary || item.content || '').replace(/\s+/g, ' ').trim();
      return text.length > 150 ? `${text.slice(0, 150)}...` : text;
    }

    function sourceName(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return 'AI News'; }
    }

    function render() {
      const items = state.filtered;
      meta.textContent = `已加载 ${state.all.length} 条，当前显示 ${items.length} 条`;

      if (!items.length) {
        list.innerHTML = '<div class="state">没有找到相关资讯。</div>';
        side.innerHTML = '';
        return;
      }

      list.innerHTML = items.map((item) => `
        <article class="card">
          <img class="thumb" src="${escapeHtml(item.imageUrl || fallbackImage)}" alt="" loading="lazy" onerror="this.src='${fallbackImage}'" />
          <div class="content">
            <span class="chip">${escapeHtml(sourceName(item.originalUrl))}</span>
            <h2>${escapeHtml(item.title)}</h2>
            <p>${escapeHtml(summary(item))}</p>
            <div class="row-foot">
              <span>${escapeHtml(formatDate(item.createdAt))}</span>
              ${item.originalUrl ? `<a href="${escapeHtml(item.originalUrl)}" target="_blank" rel="noopener noreferrer">查看原文</a>` : ''}
            </div>
          </div>
        </article>
      `).join('');

      side.innerHTML = `
        <h3>今日必读</h3>
        ${items.slice(0, 8).map((item, index) => `
          <a class="rank" href="${escapeHtml(item.originalUrl || '#')}" target="_blank" rel="noopener noreferrer">
            <span>${String(index + 1).padStart(2, '0')}</span>
            <span>${escapeHtml(item.title)}</span>
          </a>
        `).join('')}
      `;
    }

    function applyFilter() {
      const query = state.query.trim().toLowerCase();
      state.filtered = query
        ? state.all.filter((item) => `${item.title || ''} ${item.summary || ''} ${item.content || ''}`.toLowerCase().includes(query))
        : state.all.slice();
      render();
    }

    async function load() {
      meta.textContent = '正在加载...';
      list.innerHTML = '<div class="state">正在加载资讯...</div>';
      const [newsRes, countRes] = await Promise.all([
        fetch(`/api/news?limit=${PAGE_SIZE}&offset=0`),
        fetch('/api/news/count').catch(() => null)
      ]);
      state.all = await newsRes.json();
      const count = countRes && countRes.ok ? await countRes.json() : null;
      state.all.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      applyFilter();
      if (count && typeof count.count === 'number') {
        meta.textContent = `数据库共 ${count.count} 条，当前显示 ${state.filtered.length} 条`;
      }
    }

    search.addEventListener('input', (event) => {
      state.query = event.target.value;
      applyFilter();
    });
    refresh.addEventListener('click', () => load().catch(showError));

    function showError(error) {
      console.error(error);
      meta.textContent = '加载失败';
      list.innerHTML = '<div class="state">暂时无法加载资讯，请稍后刷新。</div>';
      side.innerHTML = '';
    }

    load().catch(showError);
  </script>
</body>
</html>
